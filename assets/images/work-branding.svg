<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">

  <defs>
    <linearGradient id="bgPearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDF9EE"/>
      <stop offset="100%" stop-color="#F3E3B6"/>
    </linearGradient>
    <radialGradient id="goldGlow1" cx="70%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FCE38A" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8A620A"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C89B22"/>
      <stop offset="50%" stop-color="#F5D97E"/>
      <stop offset="100%" stop-color="#FFF9E2"/>
    </linearGradient>
    <linearGradient id="liquidGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#FFFDF7" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#F7E6B2" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#E5C158" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#9A7210" flood-opacity="0.18"/>
    </filter>
    <filter id="goldBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="goldGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="900" height="1100" fill="url(#bgPearl)"/>
  <rect width="900" height="1100" fill="url(#goldGlow1)"/>
  <rect width="900" height="1100" fill="url(#goldGlow2)"/>
  <rect width="900" height="1100" fill="url(#goldGrid)"/>

  <circle cx="720" cy="220" r="140" fill="url(#goldMetallic)" opacity="0.22" filter="url(#goldBlur)"/>
  <g filter="url(#softShadow)" transform="translate(90, 150)">
    <rect width="720" height="800" rx="36" fill="url(#liquidGlass)" stroke="url(#glassBorder)" stroke-width="2.5"/>
    <text x="60" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#8C630A" letter-spacing="2">01 // PAID MEDIA &amp; ROAS ARCHITECTURE</text>
    <text x="60" y="155" font-family="'Fraunces', serif" font-size="46" font-weight="800" fill="#1E1A12">6.8x Return on</text>
    <text x="60" y="210" font-family="'Fraunces', serif" font-size="46" font-weight="800" fill="#9C7112" font-style="italic">Ad Spend Engine</text>

    <!-- 3D Liquid Gold Funnel Rings -->
    <g transform="translate(110, 270)">
      <ellipse cx="250" cy="70" rx="220" ry="48" fill="url(#goldSoft)" stroke="#FFFFFF" stroke-width="2"/>
      <ellipse cx="250" cy="165" rx="165" ry="40" fill="url(#goldMetallic)" opacity="0.88" stroke="#FFFFFF" stroke-width="2"/>
      <ellipse cx="250" cy="255" rx="110" ry="32" fill="url(#goldMetallic)" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="250" cy="345" r="46" fill="url(#goldMetallic)" filter="url(#softShadow)"/>
      <text x="230" y="353" font-family="'Fraunces', serif" font-size="24" font-weight="800" fill="#FFFFFF">ROI</text>
    </g>

    <!-- Bottom Metric Pills -->
    <rect x="60" y="670" width="280" height="76" rx="22" fill="#FFFFFF" fill-opacity="0.82" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <text x="90" y="705" font-family="'Fraunces', serif" font-size="24" font-weight="800" fill="#1E1A12">-42% CAC</text>
    <text x="90" y="728" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#8C630A"> acquisition cost reduction</text>

    <rect x="370" y="670" width="290" height="76" rx="22" fill="url(#goldMetallic)"/>
    <text x="400" y="705" font-family="'Fraunces', serif" font-size="24" font-weight="800" fill="#1E1A12">$14.2M+ Scaled</text>
    <text x="400" y="728" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1E1A12">Attributed client pipeline</text>
  </g>

</svg>