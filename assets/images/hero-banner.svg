<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">

  <defs>
    <linearGradient id="bgPearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDF9EE"/>
      <stop offset="100%" stop-color="#F3E3B6"/>
    </linearGradient>
    <radialGradient id="goldGlow1" cx="70%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FCE38A" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8A620A"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C89B22"/>
      <stop offset="50%" stop-color="#F5D97E"/>
      <stop offset="100%" stop-color="#FFF9E2"/>
    </linearGradient>
    <linearGradient id="liquidGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#FFFDF7" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#F7E6B2" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#E5C158" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#9A7210" flood-opacity="0.18"/>
    </filter>
    <filter id="goldBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="goldGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#D4AF37" stroke-width="0.6" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bgPearl)"/>
  <rect width="1200" height="900" fill="url(#goldGlow1)"/>
  <rect width="1200" height="900" fill="url(#goldGlow2)"/>
  <rect width="1200" height="900" fill="url(#goldGrid)"/>

  <!-- Ambient 3D Liquid Gold Orbs -->
  <circle cx="960" cy="180" r="110" fill="url(#goldMetallic)" opacity="0.25" filter="url(#goldBlur)"/>
  <circle cx="220" cy="700" r="140" fill="url(#goldMetallic)" opacity="0.22" filter="url(#goldBlur)"/>
  <circle cx="920" cy="210" r="64" fill="url(#goldMetallic)" filter="url(#softShadow)"/>
  <circle cx="230" cy="220" r="34" fill="url(#goldSoft)" filter="url(#softShadow)"/>

  <!-- Main Liquid Glass Dashboard Card -->
  <g filter="url(#softShadow)" transform="translate(140, 120)">
    <rect x="0" y="0" width="920" height="620" rx="34" fill="url(#liquidGlass)" stroke="url(#glassBorder)" stroke-width="2.5"/>
    <!-- Top Browser / Hologram Bar -->
    <circle cx="42" cy="40" r="8" fill="url(#goldMetallic)"/>
    <circle cx="68" cy="40" r="8" fill="#E8D292"/>
    <circle cx="94" cy="40" r="8" fill="#F4E7BE"/>
    <rect x="130" y="28" width="280" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.75"/>
    <text x="150" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#8C630A" letter-spacing="1.5">TEABISCUITMEDIA // ROAS ENGINE</text>
    <line x1="0" y1="78" x2="920" y2="78" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Left KPI Glass Module -->
    <rect x="44" y="114" width="360" height="210" rx="24" fill="#FFFFFF" fill-opacity="0.72" stroke="url(#glassBorder)" stroke-width="1.8"/>
    <text x="74" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#8C7E65" letter-spacing="1.2">OMNICHANNEL REVENUE</text>
    <text x="74" y="220" font-family="'Fraunces', Georgia, serif" font-size="54" font-weight="800" fill="#1E1A12">+418%</text>
    <rect x="74" y="246" width="165" height="34" rx="17" fill="url(#goldMetallic)"/>
    <text x="94" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#1E1A12">▲ 6.8x Avg. ROAS</text>

    <!-- Right Ascending 3D Gold Bar Chart Module -->
    <rect x="436" y="114" width="440" height="460" rx="24" fill="#FFFFFF" fill-opacity="0.68" stroke="url(#glassBorder)" stroke-width="1.8"/>
    <text x="472" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#1E1A12" letter-spacing="1">CONVERSION VELOCITY</text>
    <!-- Gold Bars -->
    <rect x="485" y="420" width="44" height="110" rx="12" fill="#F2DF9F"/>
    <rect x="555" y="370" width="44" height="160" rx="12" fill="#EBD07A"/>
    <rect x="625" y="310" width="44" height="220" rx="12" fill="#DFBE52"/>
    <rect x="695" y="245" width="44" height="285" rx="12" fill="url(#goldMetallic)"/>
    <rect x="765" y="180" width="44" height="350" rx="12" fill="url(#goldMetallic)" filter="url(#softShadow)"/>
    <!-- Rising Trend Line -->
    <path d="M 505 400 C 575 360, 640 290, 785 165" fill="none" stroke="url(#goldMetallic)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="785" cy="165" r="11" fill="#FFFFFF" stroke="url(#goldMetallic)" stroke-width="5"/>

    <!-- Bottom Left Attribution Ring Card -->
    <rect x="44" y="352" width="360" height="222" rx="24" fill="#FFFFFF" fill-opacity="0.72" stroke="url(#glassBorder)" stroke-width="1.8"/>
    <circle cx="140" cy="462" r="58" fill="none" stroke="#F3E2B3" stroke-width="16"/>
    <circle cx="140" cy="462" r="58" fill="none" stroke="url(#goldMetallic)" stroke-width="16" stroke-dasharray="275 365" stroke-linecap="round"/>
    <text x="115" y="470" font-family="'Fraunces', serif" font-size="22" font-weight="800" fill="#1E1A12">94%</text>
    <text x="225" y="438" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#1E1A12">AI Attribution</text>
    <text x="225" y="466" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="600" fill="#6E6250">Meta • Google • SEO</text>
    <text x="225" y="492" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#9E7312">Real-Time Scaling</text>
  </g>

  <!-- Floating Front Liquid Glass Pill -->
  <g filter="url(#softShadow)" transform="translate(650, 660)">
    <rect x="0" y="0" width="370" height="96" rx="48" fill="url(#liquidGlass)" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="52" cy="48" r="28" fill="url(#goldMetallic)"/>
    <path d="M42 52 L49 43 L55 48 L64 37" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="98" y="44" font-family="'Fraunces', serif" font-size="20" font-weight="800" fill="#1E1A12">24K Growth Standard</text>
    <text x="98" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#8C630A">Verified Performance Partner</text>
  </g>

</svg>