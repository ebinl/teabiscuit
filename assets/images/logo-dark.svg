<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7418"/>
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="60" y1="10" x2="310" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C89D28"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#9E7614"/>
    </linearGradient>
    <linearGradient id="liquidGlass" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F9F1D8" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- Liquid Glass & 24K Gold Emblem -->
  <g transform="translate(2, 2)">
    <!-- Outer Gold Frame -->
    <rect x="2" y="2" width="48" height="48" rx="15" fill="url(#goldGrad)"/>
    <!-- Liquid Transparent Inner Glass Layer -->
    <rect x="4.5" y="4.5" width="43" height="43" rx="13" fill="url(#liquidGlass)" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.9"/>
    <!-- Ascending Digital Growth Wave & Crown/Media Prism -->
    <path d="M14 33L21 25L27 29L37 17" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 17H37V23" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glowing Gold Media Node Dots -->
    <circle cx="14" cy="33" r="2.5" fill="#B8891E"/>
    <circle cx="21" cy="25" r="2.5" fill="#D4AF37"/>
    <circle cx="27" cy="29" r="2.5" fill="#B8891E"/>
  </g>
  <!-- Typography: TEABISCUITMEDIA -->
  <text x="62" y="32" font-family="'Fraunces', 'Georgia', serif" font-size="21.5" font-weight="800" letter-spacing="0.02em" fill="#1A1712">
    TEABISCUIT<tspan fill="url(#goldTextGrad)">MEDIA</tspan>
  </text>
  <text x="63" y="45" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.26em" fill="#9E7B23">
    DIGITAL MARKETING AGENCY
  </text>
</svg>
